[package]
name = "vpn-switcher"
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
description = "Switch between mutually incompatible VPNs from a tidy CLI"
license = "MIT"
repository = "https://github.com/AdrienGras/vpn-switcher"
readme = "README.md"
include = ["src/**/*", "tests/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]
keywords = ["vpn", "cli", "tailscale", "netbird", "protonvpn"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/vpns-{ target }.tar.gz"
bin-dir = "vpns-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "vpns"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
etcetera = "0.11.0"
indicatif = "0.18.6"
inquire = "0.9.4"
nix = { version = "0.31.3", features = ["signal", "process"] }
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
